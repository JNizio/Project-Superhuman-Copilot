name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  release:
    types: [ published ]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: dotnet publish src/SuperhumanCopilot/SuperhumanCopilot.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: SuperhumanCopilot-Windows-x64
          path: publish/SuperhumanCopilot.exe
      - name: Attach EXE to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" publish/SuperhumanCopilot.exe --clobber
